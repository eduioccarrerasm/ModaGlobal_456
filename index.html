<!DOCTYPE html>
<html lang="ca">
    <head>
        <title>ModaGlobal</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="static/css/style.css">
        <script src="static/js/script.js"></script>
    </head>
    <body>
        <h1>Moda Global</h1>
        Martí Carreras Monteagudo
        <section id="contacte">
            <form>
                <fieldset>
                    <legend><h2>Contacte</h2></legend>
                    <div id="fieldgroup">
                        <div>
                            <label for="nom">Nom</label>
                            <input id="nom" type="text" name="nom">
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input id="email" type="text" name="email">
                        </div>
                        <div>
                            <label for="missatge">Missatge</label>
                            <textarea
                                id="missatge"
                                name="missatge"
                                rows="10"></textarea>
                        </div>
                        <div>
                            <label></label>
                            <button id="envia" type="button">Envia</button>
                        </div>
                    </div>
                </fieldset>
            </form>
        </section>
	<footer>
		ModaGlobal 2025
	</footer>
    </body>
</html>
